<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>世界地圖測驗</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2ece0;--surface:#e8e0d0;--card:#faf6ee;--border:#c4b89a;
  --text:#2a2010;--muted:#7a6e56;--accent:#1a5fa8;
  --green:#1a7a3a;--green-land:#4cc870;
  --red:#c0392b;--red-land:#e05a4a;
  --gold:#8a6a0a;--small:#c44a08;
  --water:#b8d4ee;
  --land-in:#bdd0e0;--land-in-h:#9abcda;
  --land-out:#d8ceb8;--land-disp:#c8bea8;
  --land-b:#7aaace;--land-b-out:#b0a488;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;overflow-x:hidden;}
.page{max-width:500px;margin:0 auto;padding:0 0 24px;}
header{text-align:center;padding:13px 12px 9px;background:var(--card);border-bottom:2px solid var(--border);}
header h1{font-size:clamp(1rem,4vw,1.45rem);color:var(--accent);font-weight:700;}
header p{color:var(--muted);font-size:.7rem;margin-top:2px;}
.cont-tabs{display:flex;justify-content:center;gap:5px;padding:9px 8px 0;flex-wrap:wrap;}
.ctab{padding:6px 13px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .16s;font-family:'Noto Sans TC',sans-serif;}
.ctab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.map-section{padding:8px 8px 0;}
.map-hd{font-size:.68rem;color:var(--muted);text-align:center;margin-bottom:3px;font-weight:600;}
.map-wrap{position:relative;background:var(--card);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;}
.map-wrap svg{display:block;width:100%;cursor:grab;}
.map-wrap svg:active{cursor:grabbing;}
.map-wrap.quiz-on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,95,168,.22);}
.zoom-row{position:absolute;bottom:7px;right:7px;display:flex;flex-direction:column;gap:3px;z-index:20;}
.zoom-row button{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:rgba(250,246,238,.92);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0002;font-weight:700;}
.zoom-row button:active{background:var(--surface);}
.legend{position:absolute;bottom:7px;left:7px;background:rgba(250,246,238,.93);border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:.62rem;color:var(--text);z-index:20;line-height:1.9;}
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.maptip{position:absolute;background:var(--accent);color:#fff;border-radius:5px;padding:3px 9px;font-size:.78rem;font-weight:700;pointer-events:none;z-index:30;white-space:nowrap;opacity:0;transition:opacity .1s;top:7px;left:7px;}
.loading{display:flex;align-items:center;justify-content:center;padding:48px 16px;color:var(--muted);font-size:.84rem;}
.water{fill:var(--water);}
.land-out{fill:var(--land-out);stroke:var(--land-b-out);stroke-width:.35;pointer-events:none;}
.land-disp{fill:var(--land-disp);stroke:var(--land-b-out);stroke-width:.4;pointer-events:none;}
.disp-lbl{font-size:13px;fill:#4a3e28;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:rgba(232,224,208,.85);stroke-width:4;pointer-events:none;font-family:'Noto Sans TC',sans-serif;font-weight:700;}
.land-in{fill:var(--land-in);stroke:var(--land-b);stroke-width:.65;cursor:pointer;transition:fill .12s;}
.land-in:hover{fill:var(--land-in-h);}
.land-correct{fill:#58d880 !important;stroke:#1a7a3a !important;stroke-width:.9 !important;}
.land-wrong{fill:var(--red-land) !important;}
.land-reveal{fill:#e06050 !important;stroke:var(--red) !important;stroke-width:1.8 !important;}
.borders{fill:none;stroke:var(--land-b);stroke-width:.45;pointer-events:none;}
.dot-sm{stroke:#fff;stroke-width:.8;cursor:pointer;transition:fill .12s;}
.lbl-sm{font-size:7.5px;fill:#1a3050;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:rgba(200,216,230,.85);stroke-width:3;pointer-events:none;font-family:'Noto Sans TC',sans-serif;font-weight:700;}
.lbl-lg{font-size:9px;fill:#1a3050;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:rgba(200,216,230,.82);stroke-width:3;pointer-events:none;font-family:'Noto Sans TC',sans-serif;font-weight:700;}
.quiz-section{padding:8px 8px 0;}
.quiz-box{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px;}
.name-row{display:flex;gap:6px;margin-bottom:10px;}
.name-row input{flex:1;padding:7px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:.88rem;font-family:'Noto Sans TC',sans-serif;}
.name-row input:focus{outline:none;border-color:var(--accent);}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:.84rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;transition:opacity .14s;}
.btn:active{opacity:.72;}
.bp{background:var(--accent);color:#fff;}
.bd{background:var(--red);color:#fff;}
.bg{background:var(--border);color:var(--text);}
.bsk{background:var(--surface);color:var(--muted);font-size:.76rem;padding:5px 10px;border:1px solid var(--border);}
.stats{display:flex;gap:5px;margin-bottom:9px;}
.sbox{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px;text-align:center;}
.sl{font-size:.58rem;color:var(--muted);}
.sv{font-size:.95rem;font-weight:700;margin-top:1px;}
.qbox{background:var(--surface);border:1.5px solid var(--accent);border-radius:9px;padding:10px;text-align:center;margin-bottom:7px;}
.qp{font-size:.68rem;color:var(--muted);margin-bottom:2px;}
.qn{font-size:clamp(1rem,5vw,1.5rem);font-weight:700;color:var(--accent);}
.streak{font-size:.7rem;color:var(--gold);margin-top:3px;}
.fb{display:none;text-align:center;font-size:.82rem;font-weight:700;padding:6px 9px;border-radius:7px;margin-bottom:7px;line-height:1.45;}
.fb.ok{background:#d0f0de;color:#145228;border:1px solid #80d09a;display:block;}
.fb.bad{background:#fce8e6;color:#7a1a12;border:1px solid #f0a09a;display:block;}
.fb.hint{background:#fef4e2;color:#6a4008;border:1px solid #e8c060;display:block;}
.arow{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.lb-section{padding:8px 8px 0;}
.lb-box{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:11px;}
.lb-box h2{font-size:.88rem;margin-bottom:7px;}
.lb-tabs{display:flex;gap:4px;margin-bottom:8px;}
.lbtab{padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.lbtab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
table{width:100%;border-collapse:collapse;font-size:.75rem;}
th{color:var(--muted);font-weight:600;text-align:left;padding:3px 4px;border-bottom:1px solid var(--border);}
td{padding:4px 4px;border-bottom:1px solid var(--surface);}
tr:last-child td{border:none;}
.rov{display:none;position:fixed;inset:0;background:#0007;z-index:100;align-items:center;justify-content:center;padding:16px;}
.rov.show{display:flex;}
.rcard{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:22px 18px;text-align:center;max-width:320px;width:100%;}
.rcard .em{font-size:1.9rem;}
.rcard h2{font-size:1.1rem;margin:5px 0 2px;}
.rcard p{color:var(--muted);font-size:.78rem;margin-bottom:12px;}
.sbig{font-size:1.7rem;font-weight:700;color:var(--gold);}
.rbtns{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
footer{text-align:center;padding:12px;color:var(--muted);font-size:.65rem;border-top:1px solid var(--border);margin-top:8px;}
</style>
</head>
<body>
<div class="page">
<header>
  <h1 id="mainTitle">🌏 亞洲地圖測驗</h1>
  <p>點選洲別切換，先在學習地圖記熟，再挑戰測驗地圖</p>
</header>
<div class="cont-tabs">
  <button class="ctab active" onclick="switchContinent('asia',this)">🌏 亞洲</button>
  <button class="ctab" onclick="switchContinent('europe',this)">🌍 歐洲</button>
  <button class="ctab" onclick="switchContinent('africa',this)">🌍 非洲</button>
  <button class="ctab" onclick="switchContinent('americas',this)">🌎 中南美</button>
  <button class="ctab" onclick="switchContinent('all',this)">🌐 全部</button>
</div>
<div class="map-section">
  <div class="map-hd">📖 學習地圖｜有國家名稱，點擊可查看</div>
  <div class="map-wrap" id="learnWrap">
    <div class="loading" id="learnLoading">🌐 地圖載入中…</div>
    <svg id="learnSVG" style="display:none"></svg>
    <div class="zoom-row">
      <button onclick="zmL(1.3)">＋</button>
      <button onclick="zmL(.77)">－</button>
      <button onclick="rstL()">⟳</button>
    </div>
    <div class="legend">
      <div><span class="ldot" style="background:var(--land-in)"></span>一般國家</div>
      <div><span class="ldot" style="background:var(--small)"></span>小國（≤5萬km²）</div>
    </div>
    <div class="maptip" id="learnTip"></div>
  </div>
</div>
<div class="quiz-section">
<div class="quiz-box">
  <div class="name-row">
    <input id="playerName" placeholder="輸入名字" maxlength="20">
    <button class="btn bp" onclick="startQuiz()">▶ 開始測驗</button>
  </div>
  <div class="stats">
    <div class="sbox"><div class="sl">⏱ 時間</div><div class="sv" id="timer">00:00</div></div>
    <div class="sbox"><div class="sl">✅ 正確</div><div class="sv" style="color:var(--green)" id="scoreOk">0</div></div>
    <div class="sbox"><div class="sl">❌ 錯誤</div><div class="sv" style="color:var(--red)" id="scoreWrong">0</div></div>
    <div class="sbox"><div class="sl">📋 剩餘</div><div class="sv" id="scoreLeft">0</div></div>
  </div>
  <div class="qbox">
    <div class="qp">在下方空白地圖點擊 👇</div>
    <div class="qn" id="qName">—</div>
    <div class="streak" id="streak">🔥 連續 0 題</div>
  </div>
  <div class="fb" id="feedback"></div>
  <div class="arow">
    <button class="btn bsk" onclick="skipQ()">跳過 →</button>
    <button class="btn bd" onclick="giveUp()">放棄</button>
  </div>
</div>
</div>
<div class="map-section" style="padding-top:6px;">
  <div class="map-hd">🎯 測驗地圖｜無名稱，點擊作答</div>
  <div class="map-wrap quiz-on" id="quizWrap">
    <div class="loading" id="quizLoading">🌐 地圖載入中…</div>
    <svg id="quizSVG" style="display:none"></svg>
    <div class="zoom-row">
      <button onclick="zmQ(1.3)">＋</button>
      <button onclick="zmQ(.77)">－</button>
      <button onclick="rstQ()">⟳</button>
    </div>
    <div class="maptip" id="quizTip"></div>
  </div>
</div>
<div class="lb-section">
<div class="lb-box">
  <h2>🏅 排行榜 <span id="lbStatus" style="font-size:.65rem;color:var(--muted);font-weight:400"></span></h2>
  <div class="lb-tabs">
    <button class="lbtab active" onclick="switchLB('all',this)">🌐 全部</button>
    <button class="lbtab" onclick="switchLB('asia',this)">🌏 亞洲</button>
    <button class="lbtab" onclick="switchLB('europe',this)">🌍 歐洲</button>
    <button class="lbtab" onclick="switchLB('africa',this)">🌍 非洲</button>
    <button class="lbtab" onclick="switchLB('americas',this)">🌎 中南美</button>
  </div>
  <table><thead><tr><th>#</th><th>玩家</th><th>洲</th><th>得分</th><th>時間</th></tr></thead>
  <tbody id="lbBody"><tr><td colspan="5" style="color:var(--muted);text-align:center">載入中…</td></tr></tbody></table>
</div>
</div>
</div>
<div class="rov" id="rov">
  <div class="rcard">
    <div class="em">🎉</div><h2>挑戰完成！</h2>
    <div class="sbig" id="finalScore">—</div>
    <p id="finalDetail">—</p>
    <div class="rbtns">
      <button class="btn bp" onclick="restartQuiz()">🔁 再玩一次</button>
      <button class="btn bg" onclick="closeResult()">🏅 排行榜</button>
    </div>
  </div>
</div>
<footer>Natural Earth · TopoJSON World Atlas v2 · 排行榜由 Firebase 提供</footer>

let tipTmr={};
function showTip(tipId,svgId,name,event){
  const svgEl=document.getElementById(svgId),t=document.getElementById(tipId);
  const [mx,my]=d3.pointer(event,svgEl),r=svgEl.getBoundingClientRect();
  const sx=r.width/svgEl.viewBox.baseVal.width,sy=r.height/svgEl.viewBox.baseVal.height;
  t.textContent=name;t.style.left=Math.min(mx*sx+8,r.width-140)+"px";
  t.style.top=Math.max(my*sy-32,4)+"px";t.style.opacity="1";
  clearTimeout(tipTmr[tipId]);tipTmr[tipId]=setTimeout(()=>t.style.opacity="0",2200);
}

function buildLearnMap(){
  const cont=CONTINENTS[CUR],cfg=cont.cfg;
  const svgEl=document.getElementById("learnSVG");
  svgEl.style.display="block";
  const ld=document.getElementById("learnLoading");if(ld)ld.style.display="none";
  svgEl.setAttribute("viewBox",`0 0 ${cfg.vw} ${cfg.vh}`);
  const proj=d3.geoMercator().center(cfg.cx).scale(cfg.sc).translate([cfg.vw/2,cfg.vh/2]);
  PROJL=proj;const path=d3.geoPath().projection(proj);
  const svg=d3.select(svgEl);svg.selectAll("*").remove();
  svg.append("rect").attr("width",cfg.vw).attr("height",cfg.vh).attr("class","water");
  const g=svg.append("g");GL=g;
  g.selectAll("path.land-out").data(WF.filter(f=>{const iso=pad(f.id);return !ISO_MAP[iso]&&!DISP_ISO[iso];})).join("path").attr("class","land-out").attr("d",path);
  g.selectAll("path.land-disp").data(WF.filter(f=>!!DISP_ISO[pad(f.id)])).join("path").attr("class","land-disp").attr("d",path);
  g.selectAll("text.disp-lbl").data((DISPLAY_ONLY[CUR]||[]).filter(d=>d.lp)).join("text").attr("class","disp-lbl").attr("x",d=>proj(d.lp)[0]).attr("y",d=>proj(d.lp)[1]).text(d=>d.n);
  g.selectAll("path.land-in").data(WF.filter(f=>!!ISO_MAP[pad(f.id)])).join("path").attr("class","land-in").attr("d",path).attr("data-iso",f=>pad(f.id))
    .on("click",function(event,f){const c=ISO_MAP[pad(f.id)];if(c)showTip("learnTip","learnSVG",c.n,event);})
    .on("mousemove",function(event,f){const c=ISO_MAP[pad(f.id)];if(c)showTip("learnTip","learnSVG",c.n,event);});
  g.append("path").datum(WB).attr("class","borders").attr("d",path);
  const ll=cont.latlng||{},smalls=cont.countries.filter(c=>c.sm&&ll[c.iso]);
  g.selectAll("circle.dot-sm").data(smalls).join("circle").attr("class","dot-sm")
    .attr("cx",c=>proj(ll[c.iso])[0]).attr("cy",c=>proj(ll[c.iso])[1]).attr("r",5).attr("fill","var(--small)")
    .on("click",function(event,c){event.stopPropagation();showTip("learnTip","learnSVG",c.n,event);})
    .on("mousemove",function(event,c){showTip("learnTip","learnSVG",c.n,event);});
  const lo=cont.labelOff||{},lp=cont.labelPos||{},sl=cont.smallLbl||{};
  function estW(t,f){return t.length*f*0.62;}function estH(f){return f*1.2;}
  const nodes=[],manualDrawn=new Set();
  smalls.forEach(c=>{
    const off=lo[c.iso];if(!(off&&off[3]))return;
    const [cx,cy]=proj(ll[c.iso]),dx=off[0],dy=off[1],tx=cx+dx,ty=cy+dy;
    if(off[2]===true){const dist=Math.sqrt(dx*dx+dy*dy);if(dist>6){const frac=Math.min(5/dist,0.4);g.append("line").attr("x1",cx+dx*frac).attr("y1",cy+dy*frac).attr("x2",tx-(dx/dist)*2).attr("y2",ty-(dy/dist)*2).attr("stroke","#4a6a8a").attr("stroke-width","0.75").attr("stroke-dasharray","2,1.5").attr("pointer-events","none");}}
    const mfsz=(cont.smFontSize||{})[c.iso]||7.5;
    g.append("text").attr("class","lbl-sm").attr("font-size",mfsz+"px").attr("text-anchor",dx<-2?"end":dx>2?"start":"middle").attr("x",tx).attr("y",ty).text(c.n);
    manualDrawn.add(c.iso);
  });
  smalls.forEach(c=>{
    if(manualDrawn.has(c.iso))return;
    const [cx,cy]=proj(ll[c.iso]),off=lo[c.iso],dx=off?off[0]:0,dy=off?off[1]:-9,fsz=(cont.smFontSize||{})[c.iso]||7.5;
    nodes.push({iso:c.iso,text:c.n,ax:cx+dx,ay:cy+dy,dotX:cx,dotY:cy,w:estW(c.n,fsz),h:estH(fsz),fsz,isSm:true,isFixed:!!off,isLocked:false,userDx:dx,userDy:dy});
  });
  cont.countries.filter(c=>!c.sm&&lp[c.iso]).forEach(c=>{
    const [px,py]=proj(lp[c.iso]),bl=cont.bigLbl||{},fsz=sl[c.iso]?7:bl[c.iso]?bl[c.iso]:8.5;
    nodes.push({iso:c.iso,text:c.n,ax:px,ay:py,dotX:px,dotY:py,w:estW(c.n,fsz),h:estH(fsz),fsz,isSm:false,isFixed:false,isLocked:!!(cont.lockedLbl||{})[c.iso],userDx:0,userDy:0});
  });
  function bbox(n){const hw=n.w/2,hh=n.h/2,adx=n.ax-n.dotX;let lx=n.isSm?(adx<-2?n.ax-n.w:adx>2?n.ax:n.ax-hw):n.ax-hw;return{x1:lx,y1:n.ay-hh,x2:lx+n.w,y2:n.ay+hh};}
  function overlaps(a,b){const ba=bbox(a),bb=bbox(b),p=1.5;return ba.x1<bb.x2+p&&ba.x2>bb.x1-p&&ba.y1<bb.y2+p&&ba.y2>bb.y1-p;}
  for(let iter=0;iter<60;iter++){for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];if(!overlaps(a,b))continue;const ba=bbox(a),bb=bbox(b);const ox=Math.min(ba.x2,bb.x2)-Math.max(ba.x1,bb.x1),oy=Math.min(ba.y2,bb.y2)-Math.max(ba.y1,bb.y1);let px=0,py=0;if(ox<oy){px=(ba.x1+ba.x2)/2<(bb.x1+bb.x2)/2?-ox:ox;}else{py=(ba.y1+ba.y2)/2<(bb.y1+bb.y2)/2?-oy:oy;}if(a.isLocked&&b.isLocked)continue;const wa=a.isLocked?0:(a.isFixed?0.25:1),wb=b.isLocked?0:(b.isFixed?0.25:1),tot=wa+wb||1;if(!a.isLocked){a.ax-=px*(wb/tot)*0.55;a.ay-=py*(wb/tot)*0.55;}if(!b.isLocked){b.ax+=px*(wa/tot)*0.55;b.ay+=py*(wa/tot)*0.55;}}}}
  nodes.forEach(n=>{
    if(manualDrawn.has(n.iso))return;
    const dist=Math.sqrt((n.ax-n.dotX)**2+(n.ay-n.dotY)**2);
    if(dist>6){const dotR=n.isSm?5:0,frac=dist>0?Math.min(dotR/dist,0.4):0;g.append("line").attr("x1",n.dotX+(n.ax-n.dotX)*frac).attr("y1",n.dotY+(n.ay-n.dotY)*frac).attr("x2",n.ax-(n.ax-n.dotX)/dist*2).attr("y2",n.ay-(n.ay-n.dotY)/dist*2).attr("stroke","#4a6a8a").attr("stroke-width","0.75").attr("stroke-dasharray","2,1.5").attr("pointer-events","none");}
    const adx=n.ax-n.dotX;
    g.append("text").attr("class",n.isSm?"lbl-sm":"lbl-lg").attr("font-size",n.fsz+"px").attr("text-anchor",n.isSm?(adx<-2?"end":adx>2?"start":"middle"):"middle").attr("x",n.ax).attr("y",n.ay).text(n.text);
  });
  (EXTRA_LABELS[CUR]||[]).forEach(ex=>{const [px,py]=proj(ex.lp);ex.n.split("\n").forEach((line,i)=>{g.append("text").attr("class","disp-lbl").attr("x",px).attr("y",py+i*14).attr("font-size","11px").text(line);});});
  svg.call(ZL);
}

    const dot=d3.select("#quizSVG").selectAll("circle.dot-sm").filter(d=>d.iso===iso);
    const fillFor={"land-correct":"var(--green-land)","land-wrong":"var(--red-land)","land-reveal":"#e06050"};
    dot.style("fill",fillFor[cls]||"var(--small)");
    if(temporary)setTimeout(()=>{if(!ANSWERED.has(iso)){el.classed(cls,false);dot.style("fill","var(--small)");}},1900);
  }else if(temporary)setTimeout(()=>{if(!ANSWERED.has(iso))el.classed(cls,false);},1900);
}

// ── QUIZ LOGIC ──
function startQuiz(){
  if(!WF){alert("地圖尚未載入！");return;}
  if(QS.active)giveUp();
  QS={active:true,queue:shuffle([...CONTINENTS[CUR].countries]),ok:0,bad:0,streak:0,wrongThisQ:0,start:Date.now(),iv:null,cur:null,player:document.getElementById("playerName").value.trim()||"匿名"};
  ANSWERED.clear();
  d3.selectAll("#quizSVG .land-in").classed("land-correct land-wrong land-reveal",false);
  d3.selectAll("#quizSVG circle.dot-sm").style("fill",null);
  clearInterval(QS.iv);
  QS.iv=setInterval(()=>{const s=0|(Date.now()-QS.start)/1000;document.getElementById("timer").textContent=String(0|s/60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);
  document.getElementById("scoreOk").textContent="0";document.getElementById("scoreWrong").textContent="0";
  document.getElementById("feedback").className="fb";nextQ();
}
function nextQ(){if(!QS.queue.length){endQuiz();return;}QS.cur=QS.queue.shift();QS.wrongThisQ=0;document.getElementById("qName").textContent=QS.cur.n;document.getElementById("scoreLeft").textContent=QS.queue.length+1;document.getElementById("streak").textContent="🔥 連續 "+QS.streak+" 題";document.getElementById("feedback").className="fb";}
function handleClick(country){
  if(!QS.active||!QS.cur)return;
  if(ANSWERED.has(country.iso)){setFB("hint","💡「"+country.n+"」已答對，這次不算");return;}
  if(country.iso===QS.cur.iso){QS.ok++;QS.streak++;document.getElementById("scoreOk").textContent=QS.ok;ANSWERED.add(country.iso);paintQ(country.iso,"land-correct",false);setFB("ok","✅ 正確！"+country.n);document.getElementById("streak").textContent="🔥 連續 "+QS.streak+" 題";setTimeout(nextQ,800);}
  else{QS.wrongThisQ++;QS.bad++;QS.streak=0;document.getElementById("scoreWrong").textContent=QS.bad;document.getElementById("streak").textContent="🔥 連續 0 題";paintQ(country.iso,"land-wrong",true);if(QS.wrongThisQ<3){setFB("bad","❌ 那是「"+country.n+"」，不對！再試一次（第"+QS.wrongThisQ+"次）");}else{setFB("bad","❌ 那是「"+country.n+"」。正確答案以紅色標示 👇");paintQ(QS.cur.iso,"land-reveal",true);setTimeout(nextQ,2500);}}
}
function setFB(cls,msg){const f=document.getElementById("feedback");f.textContent=msg;f.className="fb "+cls;}
function skipQ(){if(!QS.active)return;QS.bad++;QS.streak=0;document.getElementById("scoreWrong").textContent=QS.bad;setFB("hint","⏭ 跳過「"+QS.cur.n+"」");nextQ();}
function giveUp(){if(!QS.active)return;clearInterval(QS.iv);QS.active=false;document.getElementById("qName").textContent="—";document.getElementById("feedback").className="fb";}
function endQuiz(){
  clearInterval(QS.iv);QS.active=false;
  const total=QS.ok+QS.bad,pct=total?Math.round(QS.ok/total*100):0,t=document.getElementById("timer").textContent;
  document.getElementById("finalScore").textContent=pct+"分";
  document.getElementById("finalDetail").textContent=QS.player+" ∙ "+CONTINENTS[CUR].label+" ∙ 正確 "+QS.ok+"/"+total+" ∙ "+t;
  document.getElementById("rov").classList.add("show");
  saveLB(QS.player,CONTINENTS[CUR].label,CONTINENTS[CUR].emoji,pct,t);
}
function restartQuiz(){closeResult();startQuiz();}
function closeResult(){document.getElementById("rov").classList.remove("show");}

// ── LEADERBOARD (cloud) ──
function switchLB(filter,btn){
  _lbFilter=filter;window._lbFilter=filter;
  document.querySelectorAll(".lbtab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderLB(filter);
}

window.renderLB=function(filter){
  filter=filter||_lbFilter||"all";
  if(!window._fbReady||!window._db){
    document.getElementById("lbBody").innerHTML='<tr><td colspan="5" style="color:var(--muted);text-align:center">連線中…</td></tr>';
    return;
  }
  const fs=window._fs,col=window._col;
  let q;
  if(filter==="all"){q=fs.query(col,fs.orderBy("score","desc"),fs.orderBy("time","asc"),fs.limit(15));}
  else{const labelMap={asia:"亞洲",europe:"歐洲",africa:"非洲",americas:"中南美洲"};q=fs.query(col,fs.where("cont","==",labelMap[filter]),fs.orderBy("score","desc"),fs.orderBy("time","asc"),fs.limit(15));}
  fs.onSnapshot(q,snap=>{
    const tb=document.getElementById("lbBody");
    if(snap.empty){tb.innerHTML='<tr><td colspan="5" style="color:var(--muted);text-align:center">尚無紀錄</td></tr>';return;}
    tb.innerHTML=snap.docs.map((doc,i)=>{const r=doc.data();return`<tr><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${r.name}</td><td style="color:var(--muted)">${r.emoji||""}${r.cont}</td><td style="color:var(--gold);font-weight:700">${r.score}分</td><td style="color:var(--muted)">${r.time}</td></tr>`;}).join("");
  });
};

async function saveLB(name,cont,emoji,score,time){
  if(!window._fbReady||!window._db)return;
  try{
    await window._fs.addDoc(window._col,{name,cont,emoji,score,time,ts:window._fs.serverTimestamp()});
    renderLB(_lbFilter);
  }catch(e){console.error("排行榜儲存失敗",e);}
}

// ── INIT ──
async function init(){
  let world;
  try{world=await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");}
  catch(e){["learnLoading","quizLoading"].forEach(id=>{const el=document.getElementById(id);el.textContent="⚠️ 地圖載入失敗，請重新整理";el.style.color="var(--red)";});return;}
  WF=topojson.feature(world,world.objects.countries).features;
  WB=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
  buildAllContinent();
  rebuildISO();buildLearnMap();buildQuizMap();
}
init();
</script>
